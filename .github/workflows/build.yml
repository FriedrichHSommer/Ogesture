name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          base64 -d keystore.b64 > /tmp/ks.p12
          keytool -importkeystore -srckeystore /tmp/ks.p12 -srcstorepass android -destkeystore ~/.android/debug.keystore -deststoretype JKS -deststorepass android -srcalias androiddebugkey -destalias androiddebugkey -noprompt
          keytool -list -keystore ~/.android/debug.keystore -storepass android
      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ogesture-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Show debug keystore fingerprint
        run: |
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android
      - name: Show APK signing certificate
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          keytool -printcert -jarfile "$APK"
